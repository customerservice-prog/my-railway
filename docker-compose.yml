services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: myrailway
      POSTGRES_USER: myrailway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [myrailway]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U myrailway -d myrailway"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--maxmemory-policy","noeviction"]
    volumes:
      - redis-data:/data
    networks: [myrailway]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  registry:
    image: registry:2
    restart: unless-stopped
    profiles: ["registry"]
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "127.0.0.1:5000:5000"
    networks: [myrailway]

  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./data/routes:/etc/traefik/dynamic:ro
      - ./data/acme.json:/etc/traefik/acme.json
    networks: [myrailway]

  updater:
    build:
      context: .
      dockerfile: Dockerfile.updater
    image: my-railway-updater:local
    restart: unless-stopped
    env_file: .env
    environment:
      UPDATER_PORT: 8090
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-/opt/my-railway}
      PLATFORM_UPDATE_REF: ${PLATFORM_UPDATE_REF:-release/private-v1-rc1}
    working_dir: ${HOST_PROJECT_DIR:-/opt/my-railway}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PROJECT_DIR:-/opt/my-railway}:${HOST_PROJECT_DIR:-/opt/my-railway}
    networks: [myrailway]
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  control:
    build: .
    image: my-railway:local
    restart: unless-stopped
    command: ["node","dist/control/server.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://myrailway:${POSTGRES_PASSWORD:-change-me-now}@postgres:5432/myrailway
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:8080"
    networks: [myrailway]

  worker:
    build: .
    image: my-railway:local
    restart: unless-stopped
    command: ["node","dist/worker/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://myrailway:${POSTGRES_PASSWORD:-change-me-now}@postgres:5432/myrailway
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      control: { condition: service_started }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [myrailway]

  agent:
    build: .
    image: my-railway:local
    restart: unless-stopped
    command: ["node","dist/agent/index.js"]
    env_file: .env
    environment:
      CONTROL_PLANE_URL: http://control:8080
      TRAEFIK_ROUTES_DIR: /var/lib/myrailway/routes
      BACKUP_DIR: /var/lib/myrailway/backups
    depends_on:
      control: { condition: service_started }
      traefik: { condition: service_started }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/routes:/var/lib/myrailway/routes
      - backup-data:/var/lib/myrailway/backups
    networks: [myrailway]

  maintenance:
    build: .
    image: my-railway:local
    restart: unless-stopped
    command: ["/bin/sh","-lc","sleep 300; while true; do /app/scripts/maintenance.sh || true; sleep 21600; done"]
    env_file: .env
    environment:
      BACKUP_DIR: /var/lib/myrailway/backups
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backup-data:/var/lib/myrailway/backups
    networks: [myrailway]

  platform-backup:
    build: .
    image: my-railway:local
    restart: unless-stopped
    command: ["/bin/sh","-lc","while true; do /app/scripts/backup-platform.sh || true; sleep 86400; done"]
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      DATABASE_HOST: postgres
      DATABASE_NAME: myrailway
      DATABASE_USER: myrailway
      BACKUP_DIR: /backups
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - backup-data:/backups
    networks: [myrailway]

networks:
  myrailway:
    name: myrailway

volumes:
  postgres-data:
  redis-data:
  registry-data:
  backup-data:
    name: myrailway-backups
