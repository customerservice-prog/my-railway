name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          retention-days: 1
      - run: npm run build
      - run: node --check public/app.js
      - run: npm test
      - run: bash -n scripts/*.sh
      - run: bash scripts/install-host.sh --help
      - run: bash scripts/export-recovery.sh --help
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker build -t my-railway:local .
      - run: bash scripts/smoke-test.sh
