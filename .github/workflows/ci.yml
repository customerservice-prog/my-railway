name: CI
permissions:
  contents: write
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          retention-days: 1
      - name: Commit generated npm lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock npm dependencies"
            git push origin HEAD:main
          fi
      - run: npm run build
      - run: node --check public/app.js
      - run: npm test
      - run: bash -n scripts/*.sh
      - run: bash scripts/install-host.sh --help
      - run: bash scripts/export-recovery.sh --help
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker build -t my-railway:local .
      - run: bash scripts/smoke-test.sh
