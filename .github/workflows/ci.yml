name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check public/app.js
      - run: node --check scripts/platform-updater.mjs
      - run: npm test
      - name: Syntax-check every shell script
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done
      - run: bash scripts/install-host.sh --help
      - run: bash scripts/export-recovery.sh --help
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker build -t my-railway:local .
      - run: docker build -f Dockerfile.updater -t my-railway-updater:local .
      - run: bash scripts/smoke-test.sh
      - run: bash scripts/self-update-integration-test.sh
      - run: bash scripts/settings-rollback-integration-test.sh
